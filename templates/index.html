<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>바낸업빗가격차이 알림</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f8; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    label { font-size: 14px; }
    input[type="number"], input[type="text"] { padding: 6px; width: 150px; }
    button { padding: 8px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #eef2f6; }
    .danger { background: #ffe4e4; color: #9a0000; font-weight: bold; }
    .ok { background: #ecfff0; color: #00641c; }
    .muted { color: #666; font-size: 12px; }
    .warningBox { background: #fff6d6; border: 1px solid #ffdb7a; padding: 8px; border-radius: 6px; margin-top: 8px; display: none; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 10px 14px; border-radius: 8px; display: none; z-index: 1000; }
    #errorLog { max-height: 140px; overflow-y: auto; background: #111; color: #ffb4b4; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>바낸업빗가격차이 알림 (웹 전용)</h2>

  <div class="card">
    <div class="row">
      <button id="startBtn">시작</button>
      <button id="stopBtn">중지</button>
      <button id="webTestBtn">웹 알림 테스트</button>
      <button id="tgTestBtn">텔레그램 테스트</button>
      <span id="statusText" class="muted">상태: 중지</span>
    </div>
    <hr />
    <div class="row">
      <label>티커(예: OM, XRP) <input id="ticker" type="text" value="OM"></label>
      <label>임계값(%) <input id="threshold" type="number" step="0.1" value="5"></label>
      <label>조회주기(초) <input id="interval" type="number" min="3" value="5"></label>
      <label>쿨다운(초) <input id="cooldown" type="number" min="10" value="300"></label>
      <label>현물/선물 괴리 차단값(%) <input id="gapThreshold" type="number" step="0.1" min="0.1" value="2"></label>
      <label><input id="webAlertToggle" type="checkbox" checked> 웹 알림 ON</label>
      <label><input id="tgToggle" type="checkbox"> 텔레그램 ON</label>
      <label><input id="ignoreSpotFuturesGap" type="checkbox"> 현물/선물 괴리 차단 ON</label>
    </div>
    <div class="row" style="margin-top: 8px;">
      <label>Telegram Bot Token <input id="tgToken" type="text" placeholder="12345:ABC..."></label>
      <label>Telegram Chat ID <input id="tgChatId" type="text" placeholder="987654321"></label>
    </div>
    <div id="gapNotice" class="warningBox"></div>
  </div>

  <div class="card">
    <h3>현재 가격</h3>
    <table>
      <thead><tr><th>항목</th><th>가격</th></tr></thead>
      <tbody>
        <tr><td>업비트 KRW-<span class="tickerText">OM</span></td><td id="pUpbit">-</td></tr>
        <tr><td>빗썸 <span class="tickerText">OM</span>_KRW</td><td id="pBithumb">-</td></tr>
        <tr><td>바이낸스 현물 <span class="tickerText">OM</span>USDT</td><td id="pBinanceSpotUsdt">-</td></tr>
        <tr><td>바이낸스 선물 <span class="tickerText">OM</span>USDT</td><td id="pBinanceFuturesUsdt">-</td></tr>
        <tr><td>바이낸스 선물-현물 가격차이(%)</td><td id="pBinanceGap">-</td></tr>
        <tr><td>USDT→KRW (업비트 KRW-USDT)</td><td id="pUsdtKrw">-</td></tr>
        <tr><td>바이낸스 현물 환산 KRW</td><td id="pBinanceSpotKrw">-</td></tr>
      </tbody>
    </table>
    <p class="muted">마지막 업데이트: <span id="updatedAt">-</span></p>
  </div>

  <div class="card">
    <h3>가격 차이(diff%) - 업비트/빗썸/바이낸스 현물 비교</h3>
    <table>
      <thead><tr><th>비교쌍</th><th>diff%</th><th>상태</th></tr></thead>
      <tbody>
        <tr id="row-upbit_bithumb"><td>업비트 ↔ 빗썸</td><td id="dUpbitBithumb">-</td><td id="sUpbitBithumb">-</td></tr>
        <tr id="row-upbit_binance_spot"><td>업비트 ↔ 바이낸스 현물(환산)</td><td id="dUpbitBinanceSpot">-</td><td id="sUpbitBinanceSpot">-</td></tr>
        <tr id="row-bithumb_binance_spot"><td>빗썸 ↔ 바이낸스 현물(환산)</td><td id="dBithumbBinanceSpot">-</td><td id="sBithumbBinanceSpot">-</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h3>오류 로그</h3>
    <div id="errorLog">(없음)</div>
  </div>

  <div id="toast"></div>

  <script>
    let timer = null;
    let lastWebAlertAt = 0;
    let lastTelegramAlertAt = 0;

    function showToast(message) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2600);
    }

    function beep() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    }

    async function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
    }

    function notifyWeb(message) {
      showToast(message);
      beep();
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('가격차 알림', { body: message });
      }
    }

    function num(v, digits = 2) {
      return Number(v).toLocaleString('ko-KR', { maximumFractionDigits: digits, minimumFractionDigits: digits });
    }

    function diffPercent(a, b) {
      const minV = Math.min(a, b);
      if (!isFinite(minV) || minV <= 0) return 0;
      return Math.abs(a - b) / minV * 100;
    }

    function currentTicker() {
      return (document.getElementById('ticker').value || 'OM').trim().toUpperCase();
    }

    function syncTickerLabel(ticker) {
      document.querySelectorAll('.tickerText').forEach(el => { el.textContent = ticker; });
    }

    function updateDiffRow(key, value, threshold) {
      const map = {
        upbit_bithumb: ['dUpbitBithumb', 'sUpbitBithumb'],
        upbit_binance_spot: ['dUpbitBinanceSpot', 'sUpbitBinanceSpot'],
        bithumb_binance_spot: ['dBithumbBinanceSpot', 'sBithumbBinanceSpot'],
      };
      const [diffEl, statusEl] = map[key];
      document.getElementById(diffEl).textContent = `${num(value, 2)}%`;
      const row = document.getElementById(`row-${key}`);
      if (value >= threshold) {
        row.className = 'danger';
        document.getElementById(statusEl).textContent = '⚠️ 임계값 초과';
      } else {
        row.className = 'ok';
        document.getElementById(statusEl).textContent = '정상';
      }
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} 요청 실패`);
      return res.json();
    }

    async function getPrices(ticker) {
      const upbitMarket = `KRW-${ticker}`;
      const bithumbMarket = `${ticker}_KRW`;
      const binanceSymbol = `${ticker}USDT`;

      const [upbitTicker, upbitUsdt, bithumb, binanceSpot, binanceFutures] = await Promise.all([
        fetchJson(`https://api.upbit.com/v1/ticker?markets=${upbitMarket}`),
        fetchJson('https://api.upbit.com/v1/ticker?markets=KRW-USDT'),
        fetchJson(`https://api.bithumb.com/public/ticker/${bithumbMarket}`),
        fetchJson(`https://api.binance.com/api/v3/ticker/price?symbol=${binanceSymbol}`),
        fetchJson(`https://fapi.binance.com/fapi/v2/ticker/price?symbol=${binanceSymbol}`),
      ]);

      if (!Array.isArray(upbitTicker) || !upbitTicker[0]?.trade_price) throw new Error(`업비트 ${upbitMarket} 미지원 또는 응답 오류`);
      if (!Array.isArray(upbitUsdt) || !upbitUsdt[0]?.trade_price) throw new Error('업비트 KRW-USDT 응답 오류');
      if (bithumb.status !== '0000') throw new Error(`빗썸 ${bithumbMarket} 미지원 또는 응답 오류`);
      if (!binanceSpot.price || !binanceFutures.price) throw new Error(`바이낸스 ${binanceSymbol} 미지원 또는 응답 오류`);

      return {
        upbitKrw: Number(upbitTicker[0].trade_price),
        usdtKrw: Number(upbitUsdt[0].trade_price),
        bithumbKrw: Number(bithumb.data.closing_price),
        binanceSpotUsdt: Number(binanceSpot.price),
        binanceFuturesUsdt: Number(binanceFutures.price),
      };
    }

    async function sendTelegram(text) {
      const token = document.getElementById('tgToken').value.trim();
      const chatId = document.getElementById('tgChatId').value.trim();
      if (!token || !chatId) throw new Error('텔레그램 토큰/Chat ID를 입력하세요.');
      const url = `https://api.telegram.org/bot${token}/sendMessage`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error('텔레그램 전송 실패');
    }

    async function tick() {
      try {
        const ticker = currentTicker();
        syncTickerLabel(ticker);

        const threshold = Number(document.getElementById('threshold').value || 5);
        const cooldownSec = Number(document.getElementById('cooldown').value || 300);
        const gapThreshold = Number(document.getElementById('gapThreshold').value || 2);

        const p = await getPrices(ticker);
        const binanceSpotKrw = p.binanceSpotUsdt * p.usdtKrw;
        const spotFuturesGap = diffPercent(p.binanceSpotUsdt, p.binanceFuturesUsdt);

        document.getElementById('pUpbit').textContent = `${num(p.upbitKrw)} KRW`;
        document.getElementById('pBithumb').textContent = `${num(p.bithumbKrw)} KRW`;
        document.getElementById('pBinanceSpotUsdt').textContent = `${num(p.binanceSpotUsdt, 6)} USDT`;
        document.getElementById('pBinanceFuturesUsdt').textContent = `${num(p.binanceFuturesUsdt, 6)} USDT`;
        document.getElementById('pBinanceGap').textContent = `${num(spotFuturesGap, 2)}%`;
        document.getElementById('pUsdtKrw').textContent = `${num(p.usdtKrw)} KRW`;
        document.getElementById('pBinanceSpotKrw').textContent = `${num(binanceSpotKrw)} KRW`;
        document.getElementById('updatedAt').textContent = new Date().toLocaleString();

        const diffs = {
          upbit_bithumb: diffPercent(p.upbitKrw, p.bithumbKrw),
          upbit_binance_spot: diffPercent(p.upbitKrw, binanceSpotKrw),
          bithumb_binance_spot: diffPercent(p.bithumbKrw, binanceSpotKrw),
        };

        updateDiffRow('upbit_bithumb', diffs.upbit_bithumb, threshold);
        updateDiffRow('upbit_binance_spot', diffs.upbit_binance_spot, threshold);
        updateDiffRow('bithumb_binance_spot', diffs.bithumb_binance_spot, threshold);

        const ignoreGap = document.getElementById('ignoreSpotFuturesGap').checked;
        const suppressAlerts = ignoreGap && spotFuturesGap >= gapThreshold;

        const gapNotice = document.getElementById('gapNotice');
        if (suppressAlerts) {
          gapNotice.style.display = 'block';
          gapNotice.textContent = `알림 차단중: 바이낸스 현물/선물 차이 ${num(spotFuturesGap, 2)}% (기준 ${num(gapThreshold, 2)}%)`;
        } else {
          gapNotice.style.display = 'none';
          gapNotice.textContent = '';
        }

        const triggered = Object.entries(diffs)
          .filter(([, value]) => value >= threshold)
          .map(([pair, diff]) => ({ pair, diff }));

        if (!suppressAlerts && triggered.length > 0) {
          const msg = `${ticker} ` + triggered.map(x => `${x.pair}: ${num(x.diff, 2)}%`).join(' | ');
          const now = Date.now() / 1000;

          if (document.getElementById('webAlertToggle').checked && (now - lastWebAlertAt >= cooldownSec)) {
            lastWebAlertAt = now;
            notifyWeb(`임계값 초과! ${msg}`);
          }

          if (document.getElementById('tgToggle').checked && (now - lastTelegramAlertAt >= cooldownSec)) {
            lastTelegramAlertAt = now;
            sendTelegram(`[가격차 알림]\n${msg}`).catch(err => showToast(err.message));
          }
        }
      } catch (err) {
        showToast(`오류: ${err.message}`);
        const log = document.getElementById('errorLog');
        log.textContent = `${new Date().toLocaleTimeString()} ${err.message}\n` + log.textContent;
      }
    }

    function startMonitoring() {
      const interval = Math.max(3, Number(document.getElementById('interval').value || 5));
      document.getElementById('statusText').textContent = '상태: 실행 중';
      showToast('모니터링 시작');
      requestNotificationPermission();
      clearInterval(timer);
      tick();
      timer = setInterval(tick, interval * 1000);
    }

    function stopMonitoring() {
      clearInterval(timer);
      timer = null;
      document.getElementById('statusText').textContent = '상태: 중지';
      document.getElementById('gapNotice').style.display = 'none';
      showToast('모니터링 중지');
    }

    async function testAlert(mode) {
      if (mode === 'web') {
        notifyWeb('[테스트] 웹 알림 테스트입니다.');
        return;
      }
      await sendTelegram('[테스트] 가격차 모니터 텔레그램 알림 테스트');
      showToast('텔레그램 테스트 전송 완료');
    }

    document.getElementById('startBtn').addEventListener('click', () => startMonitoring());
    document.getElementById('stopBtn').addEventListener('click', () => stopMonitoring());
    document.getElementById('webTestBtn').addEventListener('click', () => testAlert('web').catch(e => showToast(e.message)));
    document.getElementById('tgTestBtn').addEventListener('click', () => testAlert('telegram').catch(e => showToast(e.message)));
  </script>
</body>
</html>
