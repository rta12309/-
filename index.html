<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>클릭 카운터</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f6fb;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        text-align: center;
        width: min(90vw, 360px);
      }
      h1 {
        margin-top: 0;
      }
      #count {
        font-size: 3rem;
        font-weight: 700;
        margin: 1rem 0 1.5rem;
        color: #1f4bd8;
      }
      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.8rem 1.2rem;
        font-size: 1rem;
        font-weight: 600;
        background: #1f4bd8;
        color: white;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>클릭 카운터</h1>
      <p id="count" aria-live="polite">0</p>
      <button id="increment" type="button">클릭!</button>
    </main>

    <script>
      const countEl = document.getElementById('count');
      const buttonEl = document.getElementById('increment');
      let count = 0;

      buttonEl.addEventListener('click', () => {
        count += 1;
        countEl.textContent = String(count);
      });
    </script>
  </body>
</html>
