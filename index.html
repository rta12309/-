<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>멀티 지갑 자산 대시보드</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>멀티 지갑 자산 대시보드</h1>
        <p>
          그룹별로 지갑을 구성하고, Etherscan / Solscan 기반으로 토큰 및 가치를 한눈에
          확인하세요.
        </p>
      </header>

      <section class="fx-panel">
        <button id="refresh-rate-btn" type="button">USDT/KRW 환율 새로고침</button>
        <div id="fx-rate-display">업비트 KRW-USDT 환율을 불러오는 중...</div>
      </section>

      <section id="group-list" class="group-list"></section>

      <div class="actions">
        <button id="add-group-btn" type="button">그룹 추가</button>
        <button id="analyze-all-btn" type="button" class="primary">전체 조회</button>
      </div>
    </main>

    <template id="group-template">
      <article class="group-card">
        <div class="group-header">
          <input type="text" class="group-name" placeholder="그룹 이름 (예: 장기보유)" />
          <div class="group-header-actions">
            <button type="button" class="add-wallet-btn">지갑 추가</button>
            <button type="button" class="remove-group-btn">그룹 삭제</button>
          </div>
        </div>

        <div class="wallet-controls">
          <p>지갑 입력칸은 그룹당 최대 10개까지 추가 가능합니다.</p>
        </div>

        <div class="wallet-list"></div>

        <div class="group-summary">
          <div>그룹 합계 (USDT): <strong class="group-total-usdt">0.00</strong></div>
          <div>그룹 합계 (KRW): <strong class="group-total-krw">0</strong></div>
        </div>

        <div class="group-results"></div>
      </article>
    </template>

    <template id="wallet-template">
      <div class="wallet-row">
        <select class="source-select" aria-label="조회 소스 선택">
          <option value="etherscan">Etherscan (Ethereum)</option>
          <option value="solscan">Solscan (Solana)</option>
        </select>
        <input type="text" class="wallet-input" placeholder="지갑 주소 입력" />
        <button type="button" class="remove-wallet-btn">삭제</button>
      </div>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
