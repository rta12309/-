<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업비트 입출금 상태 조회</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 980px; margin: 24px auto; padding: 0 12px; }
    button { padding: 10px 14px; cursor: pointer; margin-right: 8px; }
    .status { margin-top: 12px; color: #333; }
    .error { color: #c62828; white-space: pre-wrap; }
    .ok { color: #2e7d32; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h2>업비트 입출금 상태 조회 (서버 프록시)</h2>
  <p>프론트는 업비트를 직접 호출하지 않고, <code>/api/upbit_wallet_status</code>만 호출합니다.</p>

  <button id="healthBtn">서버 상태 확인(/health)</button>
  <button id="loadBtn">업비트 입출금 상태 조회</button>

  <p id="health" class="status">헬스체크 미실행</p>
  <p id="status" class="status">대기 중</p>
  <p id="error" class="error"></p>

  <table>
    <thead>
      <tr>
        <th>코인</th>
        <th>wallet_state(입금)</th>
        <th>block_state(출금)</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>

  <script>
    const healthBtn = document.getElementById('healthBtn');
    const loadBtn = document.getElementById('loadBtn');
    const healthEl = document.getElementById('health');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const resultBody = document.getElementById('resultBody');

    async function checkHealth() {
      healthEl.textContent = '헬스체크 중...';
      healthEl.className = 'status';
      try {
        const res = await fetch('/health');
        const json = await res.json();
        healthEl.textContent = `health: HTTP ${res.status} / ${JSON.stringify(json)}`;
        if (json.ok === true) {
          healthEl.className = 'status ok';
        }
      } catch (err) {
        healthEl.textContent = `health 실패: ${err.message}`;
        healthEl.className = 'status error';
      }
    }

    async function loadWalletStatus() {
      statusEl.textContent = '조회 중...';
      errorEl.textContent = '';
      resultBody.innerHTML = '';

      try {
        const res = await fetch('/api/upbit_wallet_status');
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = `HTTP ${res.status} / ${JSON.stringify(data)}`;
          statusEl.textContent = '실패';
          return;
        }

        if (data.error) {
          errorEl.textContent = `API 오류: HTTP ${res.status} / ${JSON.stringify(data)}`;
          statusEl.textContent = '실패';
          return;
        }

        const rows = Array.isArray(data.data) ? data.data : (Array.isArray(data.data?.data) ? data.data.data : []);
        for (const item of rows) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.currency ?? '-'}</td>
            <td>${item.wallet_state ?? '-'}</td>
            <td>${item.block_state ?? '-'}</td>
          `;
          resultBody.appendChild(tr);
        }

        statusEl.textContent = `완료: HTTP ${res.status}, upbit_status=${data.upbit_status_code ?? '-'}, ${rows.length}개 코인`;
      } catch (err) {
        statusEl.textContent = '실패';
        errorEl.textContent = `fetch 예외: ${err.message}`;
      }
    }

    healthBtn.addEventListener('click', checkHealth);
    loadBtn.addEventListener('click', loadWalletStatus);

    // 페이지 로드 시 먼저 서버 생존 확인
    checkHealth();
  </script>
</body>
</html>
